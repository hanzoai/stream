# Canonical caller — every knob lives in /hanzo.yml, none here.
# The reusable is resolved out of .github/workflows and only there: github.com
# accepts no other path, and the forge reads it there too. Naming
# .hanzo/workflows resolves nothing, and it is resolved while the run is
# INSERTED — so the push created no run at all. No run, no error, nothing to
# read, and this repo published no image for as long as that line stood.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    secrets: inherit
